# Daily incremental crawl.
#
# Runs on a SELF-HOSTED macOS runner (railcite-mac), not a GitHub-hosted one:
# indianrailways.gov.in refuses connections from GitHub's Azure IP ranges
# (deterministic "fetch failed" at connect time), while the identical request
# succeeds from this Mac. Ingest also shells out to pdftotext and tesseract and
# can run for minutes. Typical night ingests 0-5 PDFs.
name: daily-crawl

on:
  schedule:
    - cron: '0 18 * * *'      # 18:00 UTC == 23:30 IST, end of day
  workflow_dispatch:

jobs:
  crawl:
    runs-on: [self-hosted, railcite]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Homebrew's bin (pdftotext, tesseract) is not on the launchd service's
      # default PATH. Add it BEFORE setup-node so node 22 still wins for `node`
      # while pdftotext/tesseract stay resolvable for later steps and the
      # pdftotext/tesseract subprocesses the ingest shells out to.
      - name: Add Homebrew to PATH
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # OCR toolchain (poppler + tesseract) is provided by Homebrew on this
      # self-hosted runner; fail loudly if either is missing rather than letting
      # every scanned PDF fail silently downstream.
      - name: Verify OCR toolchain
        run: command -v pdftotext && command -v tesseract

      # No Anthropic key: ingest embeds (Voyage) but never synthesises.
      - name: Crawl and ingest new circulars
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: npx tsx scripts/crawl-daily.ts --apply
